[metadata]
name = iptv-m3u
version = 1.0.0
description = Canonical, health-aware IPTV M3U generation pipeline
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.9
install_requires =
    requests>=2.31,<3

[options.packages.find]
include =
    scripts
    scripts.*
