name: Update TVivu Playlist

on:
  schedule:
    - cron: "10 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tvivu-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: python -m pip install -r requirements.txt

      - name: Extract TVivu HD and FHD streams
        run: python sources/tvivu/generate.py --no-logo-resolve

      - name: Validate playlists
        run: python scripts/validate/validate_m3u.py

      - name: Commit generated source
        run: >-
          python scripts/ci/commit_changes.py 'chore: refresh TVivu playlist' --push
          --regenerate "python sources/tvivu/generate.py --no-logo-resolve"
          playlists/sources/tvivu-music.m3u
