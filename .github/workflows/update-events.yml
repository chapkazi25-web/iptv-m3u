name: Update Live Events

on:
  schedule:
    # Daily, shortly after midnight UTC. Live games are a today-only guide:
    # this refreshes the core source games, resolves today's fixture cache
    # and rebuilds the catalog so new-day games appear and finished ones
    # leave on the next pass.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-artifacts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's fixture cache
        # Warms data/event-schedule.json for the current UTC day only. The
        # schedule API rate limits aggressively, so only missing days are
        # requested; the rebuild below matches games against today alone.
        run: python scripts/events/fixture_schedule.py --days 0 --back 0

      - name: Rebuild guide for today
        run: >-
          python scripts/discover/rebuild_from_tvguide.py
          && python scripts/build/merge_playlists.py --allow-unmapped
          && python scripts/logos/apply_logos.py

      - name: Validate playlists
        run: python scripts/validate/validate_m3u.py

      - name: Commit event state
        run: >-
          python scripts/ci/commit_changes.py 'data: refresh today live games' --push
          --regenerate "python scripts/discover/rebuild_from_tvguide.py && python scripts/build/merge_playlists.py --allow-unmapped && python scripts/logos/apply_logos.py"
          data/channels.json data/categories.json data/event-schedule.json data/stream-index.json data/build-report.json playlists
